name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # unit tests, the store contract tests, and end-to-end tests of every store with every broker, on embedded
      # brokers (Kafka, and Qpid for RabbitMQ) and databases (in-memory MongoDB, H2): no services needed
      - run: ./mvnw -B verify
