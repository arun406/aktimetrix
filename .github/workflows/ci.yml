name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [11, 17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # unit tests and end-to-end tests on an embedded Kafka and an in-memory MongoDB: no services needed
      - run: ./mvnw -B verify
