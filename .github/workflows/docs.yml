name: Documentation

# Builds the documentation site (the guides, the white paper, the changelog, and the Java and REST API references)
# and publishes it to GitHub Pages from main. Pull requests that touch the documentation build it too, so a broken
# link fails before it is merged.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'RELEASING.md'
      - 'docs/**'
      - 'img/**'
      - 'site/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer push waits rather than cancels one in progress
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: site/requirements.txt
      - run: pip install -r site/requirements.txt
      # the REST API reference is the OpenAPI document the API generates of itself, saved by its test
      - name: Generate the API references
        run: |
          ./mvnw -B -q install -DskipTests
          ./mvnw -B -q -pl aktimetrix-rest test -Dtest=OpenApiTest
          ./mvnw -B -q javadoc:aggregate
      - name: Build the site
        run: |
          python site/prepare.py
          mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
