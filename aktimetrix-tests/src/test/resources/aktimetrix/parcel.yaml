# The parcel process, as a YAML definition file. Its steps BOOK, PICKUP and SORT are the tenant's shared steps,
# defined in step-definitions.json; DELIVER is defined here.
tenant: T1
processes:
  - processCode: PARCEL
    entityType: parcel
    status: CONFIRMED
    startEventCodes: [PARCEL_BOOKED]
    cancelEventCodes: [PARCEL_CANCELLED]
    restartable: true           # a parcel booked again after its run ended starts a new run
    plannedWithin: PT12H
    measurements:
      - measurementCode: DISTANCE
        type: P
    steps:
      - stepCode: BOOK
      - stepCode: PICKUP
      - stepCode: SORT
      - stepCode: DELIVER
        startEventCodes: [PARCEL_DELIVERED]
        plannedAfter: SORT
        plannedWithin: PT5H
  - processCode: RETURN
    entityType: return
    status: CONFIRMED
    startEventCodes: [RETURN_REQUESTED]
    steps:
      - stepCode: INSPECT
        startEventCodes: [RETURN_INSPECTED]
        repeatable: true          # a returned item may be inspected more than once
      - stepCode: REFUND
        startEventCodes: [RETURN_REFUNDED]
        alternative: SETTLEMENT   # refunded or replaced, whichever happens first
      - stepCode: REPLACE
        startEventCodes: [RETURN_REPLACED]
        alternative: SETTLEMENT
