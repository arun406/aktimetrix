  <text x="40" y="48" text-anchor="start" class="h">ORDER #1234 · PRIORITY CUSTOMER</text>
  <text x="40" y="70" text-anchor="start" class="ts">The plan is created with the order, by rules: for the order as a whole (process instance) and for each of its steps (step instances). Events record the actuals.</text>
