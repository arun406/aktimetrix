  <text x="40" y="48" text-anchor="start" class="h">ORDER #1234 · PRIORITY CUSTOMER</text>
  <text x="40" y="70" text-anchor="start" class="ts">Plan created when the order is created, by rule: a priority customer is delivered within 1 day. Each step plans its measurements; each event records the actual ones.</text>
