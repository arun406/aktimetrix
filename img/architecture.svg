<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5B63"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C77C02"/>
    </marker>
    <style>
      .t  { font-size: 15px; fill: #1F2D33; }
      .tb { font-size: 16px; font-weight: 700; fill: #1F2D33; }
      .ts { font-size: 12.5px; fill: #5B6B72; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 12.5px; fill: #0F4C5C; }
      .h  { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #5B6B72; }
      .box { fill: #FFFFFF; stroke: #B7C7CD; stroke-width: 1.5; }
      .core { fill: #E8F4F7; stroke: #0F4C5C; stroke-width: 1.5; }
      .topic { fill: #FFF4DE; stroke: #C77C02; stroke-width: 1.5; }
      .db { fill: #E9F5EC; stroke: #2E8B47; stroke-width: 1.5; }
      .edge { stroke: #4A5B63; stroke-width: 1.8; fill: none; }
      .kedge { stroke: #C77C02; stroke-width: 1.8; fill: none; }
    </style>
  </defs>
  <rect width="1280" height="700" rx="18" fill="#F7FAFB" stroke="#DCE5E8"/>

  <!-- column headers -->
  <text x="40" y="52" class="h">SOURCES</text>
  <text x="262" y="52" class="h">INBOUND TOPIC</text>
  <text x="484" y="52" class="h">AKTIMETRIX RUNTIME</text>
  <text x="1040" y="52" class="h">OUTBOUND TOPICS</text>

  <!-- sources -->
  <rect x="40" y="120" width="180" height="60" rx="10" class="box"/>
  <text x="130" y="148" text-anchor="middle" class="tb">Order service</text>
  <text x="130" y="168" text-anchor="middle" class="ts">ORDER_PLACED_EVENT</text>
  <rect x="40" y="200" width="180" height="60" rx="10" class="box"/>
  <text x="130" y="228" text-anchor="middle" class="tb">Warehouse</text>
  <text x="130" y="248" text-anchor="middle" class="ts">ORDER_SHIPPED_EVENT</text>
  <rect x="40" y="280" width="180" height="60" rx="10" class="box"/>
  <text x="130" y="308" text-anchor="middle" class="tb">Carrier</text>
  <text x="130" y="328" text-anchor="middle" class="ts">ORDER_DELIVERED_EVENT</text>

  <path d="M220,150 C245,150 240,215 262,222" class="kedge" marker-end="url(#arrK)"/>
  <path d="M220,230 L262,230" class="kedge" marker-end="url(#arrK)"/>
  <path d="M220,310 C245,310 240,245 262,238" class="kedge" marker-end="url(#arrK)"/>

  <!-- inbound topic -->
  <rect x="264" y="198" width="190" height="64" rx="32" class="topic"/>
  <text x="359" y="226" text-anchor="middle" class="tb">Kafka</text>
  <text x="359" y="246" text-anchor="middle" class="mono">order-event-topic</text>

  <!-- runtime container -->
  <rect x="484" y="72" width="526" height="600" rx="16" fill="#FFFFFF" stroke="#0F4C5C" stroke-width="2" stroke-dasharray="7 5"/>

  <!-- processor lane -->
  <text x="506" y="102" class="h">① PROCESSOR</text>
  <rect x="506" y="116" width="220" height="84" rx="10" class="core"/>
  <text x="616" y="146" text-anchor="middle" class="tb">Event handler</text>
  <text x="616" y="166" text-anchor="middle" class="mono">@EventHandler</text>
  <text x="616" y="186" text-anchor="middle" class="ts">routes by eventCode</text>
  <rect x="768" y="116" width="220" height="84" rx="10" class="core"/>
  <text x="878" y="146" text-anchor="middle" class="tb">Process handler</text>
  <text x="878" y="166" text-anchor="middle" class="mono">@ProcessHandler</text>
  <text x="878" y="186" text-anchor="middle" class="ts">creates process + step instances</text>
  <path d="M726,158 L766,158" class="edge" marker-end="url(#arr)"/>
  <rect x="506" y="214" width="482" height="40" rx="8" fill="#F1F5F6" stroke="#B7C7CD"/>
  <text x="747" y="239" text-anchor="middle" class="t"><tspan class="mono">@PreProcessor</tspan>  ▸  persist instances  ▸  <tspan class="mono">@PostProcessor</tspan></text>

  <path d="M454,230 C480,230 480,158 504,158" class="kedge" marker-end="url(#arrK)"/>

  <!-- internal step topic -->
  <rect x="580" y="282" width="334" height="48" rx="24" class="topic"/>
  <text x="747" y="311" text-anchor="middle" class="mono">step-instance-out-0</text>
  <path d="M747,254 L747,280" class="kedge" marker-end="url(#arrK)"/>

  <!-- meter lane -->
  <text x="506" y="364" class="h">② METER</text>
  <rect x="506" y="378" width="220" height="84" rx="10" class="core"/>
  <text x="616" y="408" text-anchor="middle" class="tb">Step event handler</text>
  <text x="616" y="428" text-anchor="middle" class="mono">STEP_EVENT</text>
  <text x="616" y="448" text-anchor="middle" class="ts">built in</text>
  <rect x="768" y="378" width="220" height="84" rx="10" class="core"/>
  <text x="878" y="408" text-anchor="middle" class="tb">Meters</text>
  <text x="878" y="428" text-anchor="middle" class="mono">@Measurement</text>
  <text x="878" y="448" text-anchor="middle" class="ts">compute planned values</text>
  <path d="M726,420 L766,420" class="edge" marker-end="url(#arr)"/>
  <path d="M747,330 C747,352 616,350 616,376" class="kedge" marker-end="url(#arrK)"/>

  <!-- storage + reference data -->
  <text x="506" y="506" class="h">③ STATE &amp; REFERENCE DATA</text>
  <rect x="506" y="520" width="220" height="130" rx="10" class="box"/>
  <text x="616" y="552" text-anchor="middle" class="tb">Reference data API</text>
  <text x="616" y="574" text-anchor="middle" class="mono">/reference-data/**</text>
  <text x="616" y="600" text-anchor="middle" class="ts">process, step &amp; measurement</text>
  <text x="616" y="618" text-anchor="middle" class="ts">definitions</text>
  <!-- mongo cylinder -->
  <g>
    <path d="M768,540 L768,636 A110,16 0 0 0 988,636 L988,540" class="db"/>
    <ellipse cx="878" cy="540" rx="110" ry="16" class="db"/>
    <text x="878" y="582" text-anchor="middle" class="tb">MongoDB</text>
    <text x="878" y="604" text-anchor="middle" class="ts">definitions · processInstances</text>
    <text x="878" y="622" text-anchor="middle" class="ts">stepInstances · measurement-instance</text>
  </g>
  <path d="M726,585 L766,585" class="edge" marker-end="url(#arr)"/>
  <path d="M960,200 C1014,290 1014,450 960,524" class="edge" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <path d="M930,462 L930,522" class="edge" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  
  <!-- outbound topics -->
  <rect x="1040" y="130" width="210" height="56" rx="28" class="topic"/>
  <text x="1145" y="163" text-anchor="middle" class="mono">process-instance-out-0</text>
  <rect x="1040" y="204" width="210" height="56" rx="28" class="topic"/>
  <text x="1145" y="237" text-anchor="middle" class="mono">step-instance-out-0</text>
  <rect x="1040" y="392" width="210" height="56" rx="28" class="topic"/>
  <text x="1145" y="425" text-anchor="middle" class="mono">measurement-instance-out-0</text>
  <path d="M988,150 L1038,150" class="kedge" marker-end="url(#arrK)"/>
  <path d="M988,180 C1012,180 1014,230 1038,230" class="kedge" marker-end="url(#arrK)"/>
  <path d="M988,420 L1038,420" class="kedge" marker-end="url(#arrK)"/>

  <!-- consumers -->
  <rect x="1040" y="520" width="210" height="130" rx="10" class="box"/>
  <text x="1145" y="552" text-anchor="middle" class="tb">Your consumers</text>
  <text x="1145" y="580" text-anchor="middle" class="t">Dashboards</text>
  <text x="1145" y="604" text-anchor="middle" class="t">Alerts &amp; notifications</text>
  <text x="1145" y="628" text-anchor="middle" class="t">Planners · Analytics</text>
  <path d="M1145,448 L1145,518" class="kedge" marker-end="url(#arrK)"/>
</svg>
