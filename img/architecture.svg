<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4A5B63"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C77C02"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B3261E"/>
    </marker>
    <style>
      .t  { font-size: 14px; fill: #1F2D33; }
      .tb { font-size: 15px; font-weight: 700; fill: #1F2D33; }
      .ts { font-size: 12px; fill: #5B6B72; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-size: 11.5px; fill: #0F4C5C; }
      .h  { font-size: 12.5px; font-weight: 700; letter-spacing: 1.5px; fill: #5B6B72; }
      .box { fill: #FFFFFF; stroke: #B7C7CD; stroke-width: 1.5; }
      .core { fill: #E8F4F7; stroke: #0F4C5C; stroke-width: 1.5; }
      .you { fill: #FFF8EC; stroke: #C77C02; stroke-width: 1.5; stroke-dasharray: 5 3; }
      .topic { fill: #FFF4DE; stroke: #C77C02; stroke-width: 1.5; }
      .db { fill: #E9F5EC; stroke: #2E8B47; stroke-width: 1.5; }
      .dead { fill: #FCEBEA; stroke: #B3261E; stroke-width: 1.5; }
      .band { fill: #FFFFFF; stroke: #DCE5E8; stroke-width: 1.2; }
      .edge { stroke: #4A5B63; stroke-width: 1.7; fill: none; }
      .kedge { stroke: #C77C02; stroke-width: 1.7; fill: none; }
      .redge { stroke: #B3261E; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="1280" height="920" rx="18" fill="#F7FAFB" stroke="#DCE5E8"/>
  <text x="60" y="54" text-anchor="start" class="h">SOURCE SYSTEMS</text>
  <rect x="260" y="66" width="172" height="54" rx="10" class="box"/>
  <text x="346.0" y="89.0" text-anchor="middle" class="tb">Shop</text>
  <text x="346.0" y="107.0" text-anchor="middle" class="ts">order created · rated</text>
  <rect x="450" y="66" width="172" height="54" rx="10" class="box"/>
  <text x="536.0" y="89.0" text-anchor="middle" class="tb">Payment provider</text>
  <text x="536.0" y="107.0" text-anchor="middle" class="ts">payment confirmed</text>
  <rect x="640" y="66" width="172" height="54" rx="10" class="box"/>
  <text x="726.0" y="89.0" text-anchor="middle" class="tb">Warehouse</text>
  <text x="726.0" y="107.0" text-anchor="middle" class="ts">handed to agent</text>
  <rect x="830" y="66" width="172" height="54" rx="10" class="box"/>
  <text x="916.0" y="89.0" text-anchor="middle" class="tb">Delivery app</text>
  <text x="916.0" y="107.0" text-anchor="middle" class="ts">travel · arrived · delivered</text>
  <path d="M1016,93 L1038,93" class="kedge" marker-end="url(#arrK)"/>
  <rect x="1040" y="66" width="180" height="54" rx="27.0" class="topic"/>
  <text x="1130.0" y="90.0" text-anchor="middle" class="tb">Message broker</text>
  <text x="1130.0" y="108.0" text-anchor="middle" class="ts">inbound channel</text>
  <rect x="40" y="148" width="1200" height="108" rx="14" class="band"/>
  <text x="60" y="188" text-anchor="start" class="h">① INTEGRATION</text>
  <text x="60" y="210" text-anchor="start" class="ts">turns each message into</text>
  <text x="60" y="227" text-anchor="start" class="ts">a business event</text>
  <rect x="260.0" y="169" width="225.0" height="66" rx="10" class="core"/>
  <text x="372.5" y="198.0" text-anchor="middle" class="tb">Event consumer</text>
  <text x="372.5" y="216.0" text-anchor="middle" class="ts">one message at a time</text>
  <rect x="505.0" y="169" width="225.0" height="66" rx="10" class="you"/>
  <text x="617.5" y="189.0" text-anchor="middle" class="tb">Event mapper</text>
  <text x="617.5" y="207.0" text-anchor="middle" class="ts">your format → event</text>
  <text x="617.5" y="225.0" text-anchor="middle" class="ts">optional</text>
  <rect x="750.0" y="169" width="225.0" height="66" rx="10" class="core"/>
  <text x="862.5" y="198.0" text-anchor="middle" class="tb">Validation</text>
  <text x="862.5" y="216.0" text-anchor="middle" class="ts">invalid → dead letters</text>
  <rect x="995.0" y="169" width="225.0" height="66" rx="10" class="core"/>
  <text x="1107.5" y="189.0" text-anchor="middle" class="tb">Unit of work</text>
  <text x="1107.5" y="207.0" text-anchor="middle" class="ts">one transaction</text>
  <text x="1107.5" y="225.0" text-anchor="middle" class="ts">per event</text>
  <rect x="40" y="270" width="1200" height="108" rx="14" class="band"/>
  <text x="60" y="310" text-anchor="start" class="h">② PROCESS</text>
  <text x="60" y="332" text-anchor="start" class="ts">applies each event to the</text>
  <text x="60" y="349" text-anchor="start" class="ts">processes and steps it concerns</text>
  <rect x="260.0" y="291" width="225.0" height="66" rx="10" class="core"/>
  <text x="372.5" y="311.0" text-anchor="middle" class="tb">Event router</text>
  <text x="372.5" y="329.0" text-anchor="middle" class="ts">event code → processes</text>
  <text x="372.5" y="347.0" text-anchor="middle" class="ts">and steps</text>
  <rect x="505.0" y="291" width="225.0" height="66" rx="10" class="you"/>
  <text x="617.5" y="311.0" text-anchor="middle" class="tb">Process handler</text>
  <text x="617.5" y="329.0" text-anchor="middle" class="ts">metadata of a process</text>
  <text x="617.5" y="347.0" text-anchor="middle" class="ts">and its steps</text>
  <rect x="750.0" y="291" width="225.0" height="66" rx="10" class="core"/>
  <text x="862.5" y="311.0" text-anchor="middle" class="tb">Lifecycle</text>
  <text x="862.5" y="329.0" text-anchor="middle" class="ts">start · complete · end</text>
  <text x="862.5" y="347.0" text-anchor="middle" class="ts">cancel · skip</text>
  <rect x="995.0" y="291" width="225.0" height="66" rx="10" class="core"/>
  <text x="1107.5" y="311.0" text-anchor="middle" class="tb">Deadline monitors</text>
  <text x="1107.5" y="329.0" text-anchor="middle" class="ts">clock-driven:</text>
  <text x="1107.5" y="347.0" text-anchor="middle" class="ts">OVERDUE</text>
  <rect x="40" y="392" width="1200" height="108" rx="14" class="band"/>
  <text x="60" y="432" text-anchor="start" class="h">③ MEASUREMENT</text>
  <text x="60" y="454" text-anchor="start" class="ts">plans, records, compares</text>
  <text x="60" y="471" text-anchor="start" class="ts">and forecasts every value</text>
  <rect x="260.0" y="413" width="176.0" height="66" rx="10" class="core"/>
  <text x="348.0" y="433.0" text-anchor="middle" class="tb">Planning</text>
  <text x="348.0" y="451.0" text-anchor="middle" class="ts">fixed values</text>
  <text x="348.0" y="469.0" text-anchor="middle" class="ts">durations</text>
  <rect x="456.0" y="413" width="176.0" height="66" rx="10" class="you"/>
  <text x="544.0" y="433.0" text-anchor="middle" class="tb">Meters</text>
  <text x="544.0" y="451.0" text-anchor="middle" class="ts">plans and actuals</text>
  <text x="544.0" y="469.0" text-anchor="middle" class="ts">by rule</text>
  <rect x="652.0" y="413" width="176.0" height="66" rx="10" class="core"/>
  <text x="740.0" y="433.0" text-anchor="middle" class="tb">Comparison</text>
  <text x="740.0" y="451.0" text-anchor="middle" class="ts">deviation, tolerance</text>
  <text x="740.0" y="469.0" text-anchor="middle" class="ts">timeliness</text>
  <rect x="848.0" y="413" width="176.0" height="66" rx="10" class="core"/>
  <text x="936.0" y="442.0" text-anchor="middle" class="tb">Forecasting</text>
  <text x="936.0" y="460.0" text-anchor="middle" class="ts">delays → AT_RISK</text>
  <rect x="1044.0" y="413" width="176.0" height="66" rx="10" class="core"/>
  <text x="1132.0" y="433.0" text-anchor="middle" class="tb">Metrics</text>
  <text x="1132.0" y="451.0" text-anchor="middle" class="ts">declared on the process</text>
  <text x="1132.0" y="469.0" text-anchor="middle" class="ts">from measurements</text>
  <rect x="40" y="514" width="1200" height="108" rx="14" class="band"/>
  <text x="60" y="554" text-anchor="start" class="h">④ MODEL</text>
  <text x="60" y="576" text-anchor="start" class="ts">what is monitored, and</text>
  <text x="60" y="593" text-anchor="start" class="ts">where each entity stands</text>
  <rect x="260.0" y="535" width="470.0" height="66" rx="10" class="you"/>
  <text x="495.0" y="555.0" text-anchor="middle" class="tb">Definitions</text>
  <text x="495.0" y="573.0" text-anchor="middle" class="ts">processes · steps · measurements · metrics</text>
  <text x="495.0" y="591.0" text-anchor="middle" class="ts">declared as data</text>
  <rect x="750.0" y="535" width="470.0" height="66" rx="10" class="core"/>
  <text x="985.0" y="555.0" text-anchor="middle" class="tb">Instances</text>
  <text x="985.0" y="573.0" text-anchor="middle" class="ts">process · step · measurement instances</text>
  <text x="985.0" y="591.0" text-anchor="middle" class="ts">with plan, actual and revision</text>
  <rect x="40" y="636" width="1200" height="108" rx="14" class="band"/>
  <text x="60" y="676" text-anchor="start" class="h">⑤ PERSISTENCE</text>
  <text x="60" y="698" text-anchor="start" class="ts">stores state, publishes</text>
  <text x="60" y="715" text-anchor="start" class="ts">results, answers queries</text>
  <rect x="260.0" y="657" width="225.0" height="66" rx="10" class="core"/>
  <text x="372.5" y="686.0" text-anchor="middle" class="tb">Repositories</text>
  <text x="372.5" y="704.0" text-anchor="middle" class="ts">version-checked saves</text>
  <rect x="505.0" y="657" width="225.0" height="66" rx="10" class="core"/>
  <text x="617.5" y="677.0" text-anchor="middle" class="tb">Outbox</text>
  <text x="617.5" y="695.0" text-anchor="middle" class="ts">results saved</text>
  <text x="617.5" y="713.0" text-anchor="middle" class="ts">with the state</text>
  <rect x="750.0" y="657" width="225.0" height="66" rx="10" class="core"/>
  <text x="862.5" y="686.0" text-anchor="middle" class="tb">Outbox relay</text>
  <text x="862.5" y="704.0" text-anchor="middle" class="ts">leased, at least once</text>
  <rect x="995.0" y="657" width="225.0" height="66" rx="10" class="core"/>
  <text x="1107.5" y="677.0" text-anchor="middle" class="tb">Query API · metrics</text>
  <text x="1107.5" y="695.0" text-anchor="middle" class="ts">where is order 1234?</text>
  <text x="1107.5" y="713.0" text-anchor="middle" class="ts">operational metrics</text>
  <path d="M1256,158 L1256,734" class="edge" marker-end="url(#arr)"/>
  <text x="1268" y="448" class="ts" text-anchor="middle" transform="rotate(90 1268 448)">each layer uses only the layers below it</text>
  <path d="M1130,120 L1130,134 L372.5,134 L372.5,167" class="kedge" marker-end="url(#arrK)"/>
  <text x="60" y="788" text-anchor="start" class="h">INFRASTRUCTURE</text>
  <path d="M270.0,788 L270.0,872 A102.5,14 0 0 0 475.0,872 L475.0,788" class="db"/>
  <ellipse cx="372.5" cy="788" rx="102.5" ry="14" class="db"/>
  <text x="372.5" y="824.0" text-anchor="middle" class="tb">State store</text>
  <text x="372.5" y="842.0" text-anchor="middle" class="ts">definitions · instances</text>
  <text x="372.5" y="860.0" text-anchor="middle" class="ts">outbox</text>
  <path d="M372.5,723 L372.5,772" class="edge" marker-end="url(#arr)"/>
  <rect x="505.0" y="792" width="170" height="46" rx="23.0" class="topic"/>
  <text x="590.0" y="820.0" text-anchor="middle" class="tb">Process events</text>
  <path d="M862.5,723 L862.5,770 L590.0,770 L590.0,790" class="kedge" marker-end="url(#arrK)"/>
  <rect x="688.0" y="792" width="170" height="46" rx="23.0" class="topic"/>
  <text x="773.0" y="820.0" text-anchor="middle" class="tb">Step events</text>
  <path d="M862.5,723 L862.5,770 L773.0,770 L773.0,790" class="kedge" marker-end="url(#arrK)"/>
  <rect x="871.0" y="792" width="170" height="46" rx="23.0" class="topic"/>
  <text x="956.0" y="820.0" text-anchor="middle" class="tb">Measurement events</text>
  <path d="M862.5,723 L862.5,770 L956.0,770 L956.0,790" class="kedge" marker-end="url(#arrK)"/>
  <rect x="1054.0" y="792" width="170" height="46" rx="23.0" class="dead"/>
  <text x="1139.0" y="820.0" text-anchor="middle" class="tb">Dead letters</text>
  <path d="M862.5,723 L862.5,770 L1139.0,770 L1139.0,790" class="redge" marker-end="url(#arrR)"/>
  <text x="864.5" y="862" text-anchor="middle" class="ts">outbound channels of the message broker → dashboards, alerting, analytics</text>
  <rect x="60" y="810" width="18" height="14" rx="3" class="you"/>
  <text x="86" y="822" text-anchor="start" class="ts">what you write</text>
  <rect x="60" y="832" width="18" height="14" rx="3" class="core"/>
  <text x="86" y="844" text-anchor="start" class="ts">provided by Aktimetrix</text>
  <rect x="60" y="854" width="18" height="14" rx="3" class="topic"/>
  <text x="86" y="866" text-anchor="start" class="ts">message broker</text>
  <rect x="60" y="876" width="18" height="14" rx="3" class="db"/>
  <text x="86" y="888" text-anchor="start" class="ts">state store</text>
</svg>
