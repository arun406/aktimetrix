  <text x="1250.0" y="261.0" text-anchor="middle" class="tb">② Scale out</text>
  <text x="1250.0" y="279.0" text-anchor="middle" class="ts">add an instance: the</text>
  <text x="1250.0" y="297.0" text-anchor="middle" class="ts">broker rebalances the</text>
  <text x="1250.0" y="315.0" text-anchor="middle" class="ts">partitions; no state is</text>
  <text x="1250.0" y="333.0" text-anchor="middle" class="ts">held in an instance</text>
  <text x="250" y="626" text-anchor="start" class="tb">①</text>
  <text x="278" y="626" text-anchor="start" class="tb">Ordering</text>
  <text x="450" y="626" text-anchor="start" class="t">events of one entity share a partition, so exactly one instance processes them, in order</text>
  <text x="250" y="656" text-anchor="start" class="tb">②</text>
  <text x="278" y="656" text-anchor="start" class="tb">Stateless instances</text>
  <text x="450" y="656" text-anchor="start" class="t">all state is in the store: an instance can be added, restarted or lost at any time</text>
  <text x="250" y="686" text-anchor="start" class="tb">③</text>
  <text x="278" y="686" text-anchor="start" class="tb">Consistency</text>
  <text x="450" y="686" text-anchor="start" class="t">state and results are written in one transaction per event; saves are version-checked</text>
  <text x="250" y="716" text-anchor="start" class="tb">④</text>
  <text x="278" y="716" text-anchor="start" class="tb">Safe everywhere</text>
  <text x="450" y="716" text-anchor="start" class="t">alarms and relays run on every instance: version checks and leases stop double work</text>
